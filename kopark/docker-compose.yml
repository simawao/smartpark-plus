services:
  frontend:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - smartpark_node_modules:/app/node_modules
      - smartpark_vinext_cache:/app/.vinext
      - smartpark_vite_cache:/app/node_modules/.vite
      - smartpark_wrangler_cache:/app/.wrangler
      - smartpark_dist_cache:/app/dist
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    restart: unless-stopped
    depends_on:
      - api

  api:
    build: ./backend
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: smartpark_plus
      DB_USER: smartpark
      DB_PASSWORD: smartpark_dev
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: smartpark_plus
      MYSQL_USER: smartpark
      MYSQL_PASSWORD: smartpark_dev
      MYSQL_ROOT_PASSWORD: smartpark_root_dev
    volumes:
      - smartpark_mysql:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/kocaeli_seed.sql:/docker-entrypoint-initdb.d/02-kocaeli-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psmartpark_root_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  smartpark_node_modules:
  smartpark_vinext_cache:
  smartpark_vite_cache:
  smartpark_wrangler_cache:
  smartpark_dist_cache:
  smartpark_mysql:
